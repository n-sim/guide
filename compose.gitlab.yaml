# Optional overlay for a local demo. See README.md.
services:
  backend:
    environment:
      GITLAB_API_URL: http://gitlab/api/v4

  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:19.4.1-ce.0}
    hostname: gitlab
    restart: unless-stopped
    shm_size: '256m'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_HTTP_PORT:-8080}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
        gitlab_rails['outbound_local_requests_whitelist'] = ['backend']
        gitlab_rails['webhook_timeout'] = 60
    ports:
      - '127.0.0.1:${GITLAB_HTTP_PORT:-8080}:80'
      - '127.0.0.1:${GITLAB_SSH_PORT:-2222}:22'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
