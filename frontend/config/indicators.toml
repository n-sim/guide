# Refresh or navigate to a project to apply

[participation]
# Multipliers of an equal commit share among authors observed in commits (high: <; low: <)
high_multiplier = 2.0
low_multiplier = 0.5

[process]
# Added + removed lines > this limit causes an alert
large_commit_lines = 400
# Subject + newline + nonempty body length < this limit causes a warning
short_message_chars = 15
generic_subject_keywords = ["update", "fix", "commit", "wip", "misc", "changes", "progress", "test", "refactor"]

[activity]
minimum_commits = 2
low_daily_commits = 1
# An alert occurs when the longest consecutive low-activity run exceeds this
# many days, within the first-to-last commit span, including zero-commit days
low_run_alert_days = 5
window_days = 7
minimum_periods = 2
variability_info_cv = 0.9
variability_warning_cv = 1.3

[comparison]
# Proportion in [0, 1]. Inclusive +/- tolerance counts as similar.
tolerance = 0.10
